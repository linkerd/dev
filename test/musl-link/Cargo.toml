# Links the C crates our consumers build with the rust-musl image, for each musl
# target. Versions match what linkerd2-proxy-init and the FIPS builds use.
[package]
name = "musl-link"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[dependencies]
aws-lc-fips-sys = "=0.13.16"
aws-lc-sys = "=0.46.0"
